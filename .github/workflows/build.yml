name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖与打包工具
        run: |
          python -m pip install --upgrade pip
          pip install cadquery-ocp openpyxl pyinstaller

      - name: 使用 PyInstaller 打包为独立 EXE
        run: |
          pyinstaller --noconfirm --onefile --console --name "STP全盘体积统计工具" --collect-all OCP batch_stp_volume.py

      - name: 保存打包好的 EXE 文件
        uses: actions/upload-artifact@v4
        with:
          name: STP全盘体积统计工具
          path: dist/STP全盘体积统计工具.exe
